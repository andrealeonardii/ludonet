<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Ludonet</title>
  <desc id="description">Una lettera L formata da nodi connessi, accompagnata da elementi colorati che richiamano il gioco.</desc>
  <defs>
    <linearGradient id="sfondo" x1="70" y1="55" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7657ff"/>
      <stop offset="1" stop-color="#3c24ad"/>
    </linearGradient>
    <linearGradient id="rete" x1="150" y1="135" x2="365" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d1ff"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#24156f" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#sfondo)" filter="url(#ombra)"/>

  <!-- Connessioni: la rete multiplayer -->
  <path d="M166 137v208c0 25 20 45 45 45h144"
        fill="none" stroke="url(#rete)" stroke-width="38"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 218l99 68 90-103M265 286l90 104"
        fill="none" stroke="#bcb0ff" stroke-width="15"
        stroke-linecap="round" opacity=".9"/>

  <!-- Nodi e pedine -->
  <circle cx="166" cy="137" r="34" fill="#ffcb47" stroke="#fff" stroke-width="12"/>
  <circle cx="166" cy="218" r="25" fill="#fff"/>
  <circle cx="265" cy="286" r="31" fill="#ff6d79" stroke="#fff" stroke-width="10"/>
  <circle cx="355" cy="183" r="28" fill="#55e6bd" stroke="#fff" stroke-width="10"/>
  <circle cx="355" cy="390" r="34" fill="#ffcb47" stroke="#fff" stroke-width="12"/>

  <!-- Dettaglio ludico -->
  <path d="M337 112h36M355 94v36" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
</svg>